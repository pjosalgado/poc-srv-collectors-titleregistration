services:
  mongo:
    image: mongo:8.2.12
    container_name: mongo-titleregistration
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: titleregistration
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo-db:/data/db
      - mongo-configdb:/data/configdb
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq-titleregistration
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: titleregistration
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis-titleregistration
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  mongo-db:
    name: mongo-db-titleregistration
  mongo-configdb:
    name: mongo-configdb-titleregistration
  rabbitmq-data:
    name: rabbitmq-data-titleregistration
  redis-data:
    name: redis-data-titleregistration

networks:
  app-network:
    name: titleregistration-network
    driver: bridge
