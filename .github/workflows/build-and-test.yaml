name: Build and Test

on:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/*.jar
          retention-days: 1
