name: Image Publish

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  DOCKER_HUB_IMAGE: paulosalgado/collectors-titleregistration
  GITHUB_PACKAGES_IMAGE: pjosalgado/collectors-titleregistration

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yaml

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: jar
          path: target

      - name: Set version
        id: pom
        run: echo "version=$(ls target/*.jar | sed 's/.*-\(.*\)\.jar$/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.pom.outputs.version }}
          tags: |
            ghcr.io/${{ env.GITHUB_PACKAGES_IMAGE }}:${{ steps.pom.outputs.version }}
            ghcr.io/${{ env.GITHUB_PACKAGES_IMAGE }}:latest
            ${{ env.DOCKER_HUB_IMAGE }}:${{ steps.pom.outputs.version }}
            ${{ env.DOCKER_HUB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
