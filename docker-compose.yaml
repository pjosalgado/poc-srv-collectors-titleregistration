services:
  app:
    build: .
    image: paulosalgado/collectors-titleregistration:local
    container_name: titleregistration
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: mongodb://titleregistration:${MONGO_PASSWORD:-password}@mongo:27017/titleregistration?authSource=admin
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:8.2.12
    container_name: mongo-titleregistration
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: titleregistration
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo-db:/data/db
      - mongo-configdb:/data/configdb
    networks:
      - app-network

volumes:
  mongo-db:
    name: mongo-db-titleregistration
  mongo-configdb:
    name: mongo-configdb-titleregistration

networks:
  app-network:
    name: titleregistration-network
    driver: bridge
